services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qs
      POSTGRES_PASSWORD: qs_dev_password   # dev only - change for any shared deployment
      POSTGRES_DB: quantum_shield
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    depends_on: [db, redis]
    environment:
      DATABASE_URL: postgresql+psycopg2://qs:qs_dev_password@db:5432/quantum_shield
      REPOS_DIR: /data/repos
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app/backend
      - repos:/data/repos

volumes:
  pgdata:
  repos:
